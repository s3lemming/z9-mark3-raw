name: Source and contract checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc python3-numpy
      - run: python3 -B tools/audit_publication.py
      - run: python3 -B tests/run.py --output "$RUNNER_TEMP/mark3-tests"
